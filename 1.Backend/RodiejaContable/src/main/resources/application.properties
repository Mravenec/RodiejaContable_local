spring.application.name=rodiejacontable

# Configuración de la base de datos MariaDB
spring.datasource.url=jdbc:mariadb://localhost:3306/sistema_vehicular
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Configuración de Hikari (pool de conexiones)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=2000000
spring.datasource.hikari.connection-timeout=30000

# Configuración de jOOQ
spring.jooq.sql-dialect=MYSQL

# Configuración de logs para depuración
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.jooq=DEBUG

# Configuración de Audatex (ROD-10)
# NOTA: Credenciales en texto plano para desarrollo. En producción usar Jasypt con ENC()
# Para cifrar: java -cp jasypt-1.9.3.jar org.jasypt.intf.cli.JasyptPBEStringEncryptionCLI input="texto" password="clave" algorithm=PBEWithMD5AndDES
jasypt.encryptor.password=${JASYPT_ENCRYPTOR_PASSWORD:mi_clave_secreta_desarrollo}

audatex.username=dvenegas
audatex.password=Inpart26/
audatex.portal-url=https://inpart-la.audatex.com.mx/AudaPartsSite/
audatex.quotation-search-url=https://inpart-la.audatex.com.mx/AudaPartsWebApp/frmQuotationSupplierSearch.aspx
audatex.session-ttl-min=30
audatex.cache-ttl-min=5
audatex.max-requests-per-min=30
audatex.human-delay-ms=800

# Caffeine cache
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=5m

# Resilience4j configuration (ROD-15)
resilience4j.circuitbreaker.instances.audatexClient.register-health-indicator=true
resilience4j.circuitbreaker.instances.audatexClient.sliding-window-size=10
resilience4j.circuitbreaker.instances.audatexClient.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.audatexClient.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.audatexClient.permitted-number-of-calls-in-half-open-state=3

resilience4j.retry.instances.audatexClient.max-attempts=3
resilience4j.retry.instances.audatexClient.wait-duration=1s
resilience4j.retry.instances.audatexClient.retry-exceptions=java.io.IOException

resilience4j.timelimiter.instances.audatexClient.timeout-duration=30s

# ROD-28: Rate limiting para envíos de cotizaciones (max 10 envíos/min)
resilience4j.ratelimiter.instances.audatexEnvios.limit-for-period=10
resilience4j.ratelimiter.instances.audatexEnvios.limit-refresh-period=1m
resilience4j.ratelimiter.instances.audatexEnvios.timeout-duration=5s
